services:
  nextjs:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE}
        - NEXT_PUBLIC_APP_ENV=${NEXT_PUBLIC_APP_ENV}
    container_name: phobee_nextjs${SUFFIX}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - ./web/.env
    networks:
      - phobee_shared_net

networks:
  phobee_shared_net:
    external: true
