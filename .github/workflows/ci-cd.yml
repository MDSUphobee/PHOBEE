name: CI/CD Web

on:
  push:
    branches:
      - DEV
      - main
      - PROD
  pull_request:
    branches:
      - DEV
      - main
      - PROD

jobs:
  test:
    name: Lint, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (règles a11y jsx-a11y bloquantes)
        run: npm run lint

      - name: Tests unitaires (Jest) + couverture
        run: npm run test:ci -- --coverage

      - name: Archiver le rapport de couverture (front)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-front
          path: web/coverage/
          if-no-files-found: ignore

      - name: Tests accessibilité (axe, WCAG 2.1 AA)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/system/a11y.spec.ts --project=system
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000/api
          API_BASE: http://localhost:8000/api
          API_URL: http://localhost:8000
          JWT_SECRET: ci-dummy-secret

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000/api
          API_BASE: http://localhost:8000/api
          API_URL: http://localhost:8000
          JWT_SECRET: ci-dummy-secret

  # Déploiement automatique sur le VPS (stack DEV) quand on pousse sur DEV
  # et seulement si le job "test" est vert.
  deploy:
    name: Déploiement VPS (DEV)
    needs: test
    if: github.ref == 'refs/heads/DEV' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            sudo chown -R debian:debian /var/www/dev_app_phobee
            cd /var/www/dev_app_phobee
            git fetch origin DEV
            git reset --hard origin/DEV
            # Le conteneur web sert un build figé : il FAUT reconstruire l'image
            # pour prendre en compte le nouveau code (un simple restart ne suffit pas).
            docker compose up -d --build nextjs

  # Déploiement automatique sur la PROD quand on pousse sur PROD (après merge DEV -> PROD),
  # et seulement si le job "test" est vert. En prod on RE-BUILD l'image (NEXT_PUBLIC_* figé au build).
  deploy-prod:
    name: Déploiement VPS (PROD)
    needs: test
    if: github.ref == 'refs/heads/PROD' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            sudo chown -R debian:debian /var/www/app_phobee
            cd /var/www/app_phobee
            git fetch origin PROD
            git reset --hard origin/PROD
            docker compose up -d --build nextjs
